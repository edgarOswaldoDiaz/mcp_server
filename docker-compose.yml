version: '3.8'

services:
  agente_a2a:
    build: .
    container_name: a2a_agent_node
    ports:
      - "8002:8001"
    env_file:
      - .env
    volumes:
      - .:/app
      - mcp-a2a-token:/run/mcp-token:ro
    networks:
      - agent-network
      - interoperability
    restart: unless-stopped

networks:
  agent-network:
    driver: bridge
  interoperability:
    external: true

volumes:
  mcp-a2a-token:
    external: true
