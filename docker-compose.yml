version: '3.8'

services:
  agente_a2a:
    image: python:3.12-slim
    container_name: a2a_agent_node
    working_dir: /app
    ports:
      - "8002:8001"
    env_file:
      - .env
    volumes:
      - .:/app
      - mcp-a2a-token:/run/mcp-token:ro
    command: >
      bash -c "pip install --no-cache-dir -r requirements.txt &&
               uvicorn src.main:app --host 0.0.0.0 --port 8001 --reload"
    networks:
      - agent-network
      - interoperability
    restart: unless-stopped

networks:
  agent-network:
    driver: bridge
  interoperability:
    external: true

volumes:
  mcp-a2a-token:
    external: true
