services:
   # 3. Agente A (Simulador de Cliente / Agente)
  agente_a:
    image: python:3.12-slim
    container_name: mcp_agente_a
    working_dir: /app
    ports:
      - "8001:8001"
    environment:
      MCP_TOKEN_PATH: /run/mcp-token/access_token
    volumes:
      - .:/app
      - mcp-a2a-token:/run/mcp-token:ro
    command: >
      bash -c "pip install --no-cache-dir -r requirements.txt && 
               uvicorn src.main:app --host 0.0.0.0 --port 8001 --reload"
    networks:
      - agent-network
      - interoperability

  # 4. Agente B
  agente_b:
    image: python:3.12-slim
    container_name: mcp_agente_b
    working_dir: /app
    environment: 
      MCP_TOKEN_PATH: /run/mcp-token/access_token
    volumes:
      - .:/app
      - mcp-a2a-token:/run/mcp-token:ro
    command: tail -f /dev/null
    networks:
      - agent-network
      - interoperability

  
networks:
  agent-network:
    driver: bridge
  interoperability:
    external: true

volumes:
  mcp-a2a-token:
    external: true
