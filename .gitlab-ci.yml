image: python:3.12

stages:
  - test


unit_tests:
  stage: test

  script:
    - python --version
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - pytest tests/unit -v


docker_test:
  stage: test

  image: docker:27-cli

  services:
    - name: docker:27-dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  script:
    - docker version
    - docker info


integration_tests:
  stage: test

  image: docker:27-cli

  services:
    - name: docker:27-dind
      alias: docker

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  script:
    - docker version
    - docker compose version
    - docker compose -f deployment/compose/docker-compose.yml up --build --abort-on-container-exit